
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hứng Táo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5dc;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #8b4513;
        }

        #game-container {
            width: 500px;
            height: 400px;
            background-color: #e0f7fa;
            border: 3px solid #795548;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            margin: 20px auto;
        }

        #basket {
            width: 80px;
            height: 35px;
            background-color: brown;
            border-radius: 5px 5px 15px 15px;
            position: absolute;
            bottom: 10px;
            left: 210px;
        }

        #apple {
            width: 30px;
            height: 30px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 100px;
        }

        #apple::before {
            content: "";
            width: 8px;
            height: 10px;
            background-color: green;
            position: absolute;
            top: -5px;
            left: 17px;
            border-radius: 8px 0;
        }

        #info {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        button {
            padding: 12px 30px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #388e3c;
        }

        #message {
            color: red;
            font-size: 25px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>🍎 GAME HỨNG TÁO 🍎</h1>

    <div id="info">
        Điểm số: <span id="score">0</span>
        |
        Mạng sống: <span id="lives">3</span>
    </div>

    <div id="game-container">
        <div id="apple"></div>
        <div id="basket"></div>
    </div>

    <button id="start-btn" onclick="startGame()">
        Bắt đầu
    </button>

    <div id="message"></div>

    <script>
        const game = document.getElementById("game-container");
        const basket = document.getElementById("basket");
        const apple = document.getElementById("apple");

        const scoreDisplay = document.getElementById("score");
        const livesDisplay = document.getElementById("lives");
        const message = document.getElementById("message");
        const startBtn = document.getElementById("start-btn");

        let score = 0;
        let lives = 3;

        let basketX = 210;
        let appleX = 0;
        let appleY = 0;

        let speed = 2;
        let gameRunning = false;
        let animationId = null;

        const gameWidth = 500;
        const gameHeight = 400;

        const basketWidth = 80;
        const basketHeight = 35;

        const appleWidth = 30;
        const appleHeight = 30;

        document.addEventListener("keydown", function(event) {

            if (!gameRunning) return;

            if (event.key === "ArrowLeft") {
                event.preventDefault();
                basketX -= 20;
            }

            if (event.key === "ArrowRight") {
                event.preventDefault();
                basketX += 20;
            }

            // Không cho giỏ ra ngoài khung game
            basketX = Math.max(
                0,
                Math.min(gameWidth - basketWidth, basketX)
            );

            basket.style.left = basketX + "px";
        });

        function resetApple() {
            appleX = Math.random() * (gameWidth - appleWidth);
            appleY = 0;

            apple.style.left = appleX + "px";
            apple.style.top = appleY + "px";
        }

        function checkCollision() {

            const basketY = gameHeight - basketHeight - 10;

            return (
                appleX < basketX + basketWidth &&
                appleX + appleWidth > basketX &&
                appleY < basketY + basketHeight &&
                appleY + appleHeight > basketY
            );
        }

        function gameLoop() {

            if (!gameRunning) return;

            appleY += speed;
            apple.style.top = appleY + "px";

            if (checkCollision()) {

                score++;
                scoreDisplay.textContent = score;

                speed += 0.3;

                resetApple();
            }

            else if (appleY + appleHeight >= gameHeight) {

                lives--;
                livesDisplay.textContent = lives;

                if (lives <= 0) {
                    endGame();
                    return;
                }

                resetApple();
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {

            if (animationId !== null) {
                cancelAnimationFrame(animationId);
            }

            score = 0;
            lives = 3;
            speed = 2;

            basketX = 210;

            scoreDisplay.textContent = score;
            livesDisplay.textContent = lives;

            basket.style.left = basketX + "px";

            message.textContent = "";

            resetApple();

            gameRunning = true;

            startBtn.textContent = "Chơi lại";

            gameLoop();
        }

        function endGame() {

            gameRunning = false;

            cancelAnimationFrame(animationId);

            message.textContent = "GAME OVER!";

            startBtn.textContent = "Chơi lại";
        }

    </script>

</body>
</html>
